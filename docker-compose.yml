version: "3.8"

services:
    faceservice:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: faceservice
        restart: always
        # Tahap 2: faceservice pindah host terpisah dari apisimak (server-utama,
        # bukan lagi 1 host via Docker network internal). apisimak (di server-app,
        # 192.168.2.2) akses faceservice lewat IP privat ini, BUKAN nama service.
        #
        # PENTING — port di-bind KHUSUS ke IP privat server ini (192.168.2.3),
        # BUKAN 0.0.0.0. Ini supaya port 8001 TIDAK PERNAH bisa diakses dari
        # interface publik server-utama sama sekali, apa pun kondisi firewall —
        # lebih aman daripada cuma mengandalkan aturan ufw/iptables (Docker
        # dikenal suka menimpa aturan ufw untuk port yang di-publish).
        ports:
            - "192.168.2.3:8001:8001"
        environment:
            # ── Database — SEKARANG LOKAL (server ini juga lokasi DB) ──────────
            DB_HOST: 127.0.0.1
            DB_PORT: "3306"
            DB_NAME: db_simpeg
            DB_USER: adminsimak
            DB_PASSWORD: ${DB_PASSWORD}
            # ── Service ────────────────────────────────────────────────────────
            FACE_SERVICE_HOST: "0.0.0.0"
            FACE_SERVICE_PORT: "8001"
            ARCFACE_THRESHOLD: "0.40"
            # ── Upload foto (Opsi B: HTTP ke apisimak di server-app) ───────────
            # Ganti ke alamat yang benar-benar bisa dijangkau dari server-utama
            # ke server-app — apisimak_nginx expose host port 8080 di sana.
            APISIMAK_INTERNAL_URL: "http://192.168.2.2:8080/api/internal/foto"
            APISIMAK_INTERNAL_TOKEN: ${APISIMAK_INTERNAL_TOKEN}
            # FOTO_FACE_PATH cuma dipakai scripts/extract_embeddings.py — TIDAK
            # relevan di server ini (foto fisiknya ada di server-app). Skrip itu
            # WAJIB dijalankan dari server-app, bukan dari container ini.
        volumes:
            # Cache model InsightFace buffalo_l (~500MB) — persistent agar tidak re-download
            - faceservice_models:/app/.insightface
        # Tidak perlu 'networks:' khusus — pakai default bridge network Compose,
        # karena tidak lagi satu host dengan apisimak (apisimak_net cuma ada di
        # server-app, akan gagal kalau di-reference di sini).

volumes:
    faceservice_models:
